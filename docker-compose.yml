services:
  # ==========================================
  # 1. INGRESS & REVERSE PROXY: TRAEFIK v3
  # ==========================================
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false" # 8080 portundan şifresiz dashboard açar
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Giriş Noktaları (EntryPoints) ve Başlık Stratejisi
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.forwardedheaders.trustedips=127.0.0.1/32,${TRUSTED_SUBNET}"
      #- "--entrypoints.web.http.aliasheadersstrategy=preferXForwarded"
      - "--entrypoints.websecure.address=:443"
      #- "--entrypoints.websecure.http.aliasheadersstrategy=preferXForwarded"
      - "--entrypoints.websecure.forwardedheaders.trustedips=127.0.0.1/32,${TRUSTED_SUBNET}"
      - "--entrypoints.webexternal.address=:444"
      #- "--entrypoints.webexternal.http.aliasheadersstrategy=preferXForwarded"
      - "--entrypoints.webexternal.forwardedheaders.trustedips=127.0.0.1/32,${TRUSTED_SUBNET}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      # Yerel Plugin Tanımı
      - "--experimental.localplugins.crowdsec.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      # Traefik Dashboard Router Tanımı:
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN_EXT}`)"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.entrypoints=webexternal"
      - "traefik.http.routers.traefik-dash.tls=true"
      # Let's Encrypt DNS Challenge (Cloudflare)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    #labels:
    #  - "traefik.enable=true"
    #  # Dashboard Router (Hem /api hem /dashboard yollarını ve iki portu da kapsar):
    #  - "traefik.http.routers.traefik-ext-dash.rule=Host(`traefik.${DOMAIN_EXT}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
    #  - "traefik.http.routers.traefik-ext-dash.entrypoints=webexternal"
    #  - "traefik.http.routers.traefik-ext-dash.service=api@internal"
    #  - "traefik.http.routers.traefik-ext-dash.tls=true"
    #  # Dashboard Router (Hem /api hem /dashboard yollarını ve iki portu da kapsar):
    #  - "traefik.http.routers.traefik-int-dash.rule=Host(`traefik.${DOMAIN_INT}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
    #  - "traefik.http.routers.traefik-int-dash.entrypoints=websecure"
    #  - "traefik.http.routers.traefik-int-dash.service=api@internal"
    #  - "traefik.http.routers.traefik-int-dash.tls=true"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
    ports:
      # - "80:80"
      - "443:443"
      - "444:444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:rw
      - ./traefik/plugins-local:/plugins-local:ro
      - traefik_logs:/var/log/traefik
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - edge_network

  # ==========================================
  # 2. MERKEZİ VERİTABANI: POSTGRESQL 16
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GUACAMOLE_DB_USER: ${GUACAMOLE_DB_USER}
      GUACAMOLE_DB_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      GUACAMOLE_DB_NAME: ${GUACAMOLE_DB_NAME}
      VAULTWARDEN_DB_USER: ${VAULTWARDEN_DB_USER}
      VAULTWARDEN_DB_PASSWORD: ${VAULTWARDEN_DB_PASSWORD}
      VAULTWARDEN_DB_NAME: ${VAULTWARDEN_DB_NAME}
      CROWDSEC_DB_USER: ${CROWDSEC_DB_USER:-crowdsec}
      CROWDSEC_DB_PASSWORD: ${CROWDSEC_DB_PASSWORD}
      CROWDSEC_DB_NAME: ${CROWDSEC_DB_NAME:-crowdsec_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backups
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # ==========================================
  # 3. IAM & SSO: ZITADEL (LOGIN V1 / YERLEŞİK UI)
  # ==========================================
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: 'start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode external'
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXT_FQDN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      # Login V2'yi kapatıp dahili Login V1 arayüzünü etkinleştirir:
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME}
      # ZITADEL_FIRSTINSTANCE_USER_USERNAME: ${ZITADEL_ADMIN_USER}
      # ZITADEL_FIRSTINSTANCE_USER_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      # YENİ (Zitadel v4 Standartı):
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USER}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      # İlk girişte zorunlu şifre değişimini atlamak isterseniz (isteğe bağlı):
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAILVERIFIED: "true"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.zitadel-int.rule=Host(`${ZITADEL_INT_FQDN}`)"
      - "traefik.http.routers.zitadel-int.entrypoints=websecure"
      - "traefik.http.routers.zitadel-int.tls=true"
      - "traefik.http.routers.zitadel-int.service=zitadel-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec)
      - "traefik.http.routers.zitadel-ext.rule=Host(`${ZITADEL_EXT_FQDN}`)"
      - "traefik.http.routers.zitadel-ext.entrypoints=webexternal"
      - "traefik.http.routers.zitadel-ext.tls=true"
      - "traefik.http.routers.zitadel-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.zitadel-ext.service=zitadel-svc"
      # Ortak gRPC / h2c Port
      - "traefik.http.services.zitadel-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.zitadel-svc.loadbalancer.server.scheme=h2c"
    networks:
      - edge_network
      - internal_network

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://${ZITADEL_EXT_FQDN}"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".${DOMAIN_EXT}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${DOMAIN_EXT}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # --- EKLENEN KRİTİK AYARLAR ---
      # 1. Oturum açıldığında Traefik'e 202 kabul yanıtı ver:
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      # 2. Ara onay butonunu atlayıp doğrudan Zitadel girişine yönlendir:
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # 3. İsteğin hangi alt alandan (portainer vb.) geldiğine bakılmaksızın callback'i sabit tut:
      OAUTH2_PROXY_REDIRECT_URL: "https://auth-proxy.${DOMAIN_EXT}/oauth2/callback"
    networks:
      - edge_network
    labels:
      - "traefik.enable=true"
      # ForwardAuth Middleware Tanımı (Tüm servislerin kullanabilmesi için)
      - "traefik.http.middlewares.zitadel-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.zitadel-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.zitadel-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
      # Proxy Callback Yönlendirmesi
      - "traefik.http.routers.oauth2-proxy.rule=Host(`auth-proxy.${DOMAIN_EXT}`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure,webexternal"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"

  # ==========================================
  # 4. KONTEYNER YÖNETİMİ: PORTAINER CE
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.portainer-int.rule=Host(`${PORTAINER_INT_FQDN}`)"
      - "traefik.http.routers.portainer-int.entrypoints=websecure"
      - "traefik.http.routers.portainer-int.tls=true"
      - "traefik.http.routers.portainer-int.service=portainer-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec Koruması)
      - "traefik.http.routers.portainer-ext.rule=Host(`${PORTAINER_EXT_FQDN}`)"
      - "traefik.http.routers.portainer-ext.entrypoints=webexternal"
      - "traefik.http.routers.portainer-ext.tls=true"
      - "traefik.http.routers.portainer-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.portainer-ext.service=portainer-svc"
      # Ortak WebGUI Servisi
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer-ext.middlewares=zitadel-auth"
    networks:
      - edge_network

  # ==========================================
  # 5. GÜVENLİK / IPS MOTORU: CROWDSEC
  # ==========================================
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
      BOUNCER_KEY_traefik_bouncer: ${CROWDSEC_BOUNCER_API_KEY}
      CROWDSEC_DB_USER: ${CROWDSEC_DB_USER:-crowdsec}
      CROWDSEC_DB_PASSWORD: ${CROWDSEC_DB_PASSWORD}
      CROWDSEC_DB_NAME: ${CROWDSEC_DB_NAME:-crowdsec_db}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - traefik_logs:/var/log/traefik:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - edge_network
      - internal_network

  # ==========================================
  # 6. ROUTING TESTİ: WHOAMI
  # ==========================================
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.whoami-int.rule=Host(`${WHOAMI_INT_FQDN}`)"
      - "traefik.http.routers.whoami-int.entrypoints=websecure"
      - "traefik.http.routers.whoami-int.tls=true"
      - "traefik.http.routers.whoami-int.service=whoami-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec Koruması)
      - "traefik.http.routers.whoami-ext.rule=Host(`${WHOAMI_EXT_FQDN}`)"
      - "traefik.http.routers.whoami-ext.entrypoints=webexternal"
      - "traefik.http.routers.whoami-ext.tls=true"
      - "traefik.http.routers.whoami-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.whoami-ext.service=whoami-svc"
      - "traefik.http.services.whoami-svc.loadbalancer.server.port=80"
    networks:
      - edge_network

  # ==========================================
  # 7. MESH VPN: TAILSCALE
  # ==========================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    hostname: identity-gateway
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=${TAILSCALE_ADVERTISED_ROUTES}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - edge_network

  # ==========================================
  # 8. SIFIR-PORT DIŞ TÜNEL: CLOUDFLARE
  # ==========================================
  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - edge_network

  # ==========================================
  # 9. GUACAMOLE DAEMON: GUACD
  # ==========================================
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - internal_network

  # ==========================================
  # 10. GUACAMOLE WEB CLIENT
  # ==========================================
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - db
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      WEBAPP_CONTEXT: ROOT
      POSTGRESQL_HOSTNAME: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${GUACAMOLE_DB_NAME}
      POSTGRESQL_USER: ${GUACAMOLE_DB_USER}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - guacamole_home:/home/guacamole/.guacamole
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.guacamole-int.rule=Host(`${GUACAMOLE_INT_FQDN}`)"
      - "traefik.http.routers.guacamole-int.entrypoints=websecure"
      - "traefik.http.routers.guacamole-int.tls=true"
      - "traefik.http.routers.guacamole-int.service=guacamole-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec Koruması)
      - "traefik.http.routers.guacamole-ext.rule=Host(`${GUACAMOLE_EXT_FQDN}`)"
      - "traefik.http.routers.guacamole-ext.entrypoints=webexternal"
      - "traefik.http.routers.guacamole-ext.tls=true"
      - "traefik.http.routers.guacamole-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.guacamole-ext.service=guacamole-svc"
      - "traefik.http.services.guacamole-svc.loadbalancer.server.port=8080"
    networks:
      - edge_network
      - internal_network

  # ==========================================
  # 11. VERITABANI YONETIMI: PGADMIN 4
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sirket.intra}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # Giriş ekranını (e-posta/şifre) tamamen kaldırır:
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # false ise Master password penceresini tamamen devre dışı bırakır:
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      # servers.json dosyasındaki güncellemelerin her başlangıçta işlenmesini sağlar:
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
      PGPASSFILE: "/pgadmin4/pgpass"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
      - ./pgadmin/config_local.py:/pgadmin4/config_local.py:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.pgadmin-int.rule=Host(`${PGADMIN_INT_FQDN}`)"
      - "traefik.http.routers.pgadmin-int.entrypoints=websecure"
      - "traefik.http.routers.pgadmin-int.tls=true"
      - "traefik.http.routers.pgadmin-int.service=pgadmin-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec Korumasi)
      - "traefik.http.routers.pgadmin-ext.rule=Host(`${PGADMIN_EXT_FQDN}`)"
      - "traefik.http.routers.pgadmin-ext.entrypoints=webexternal"
      - "traefik.http.routers.pgadmin-ext.tls=true"
      - "traefik.http.routers.pgadmin-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.pgadmin-ext.service=pgadmin-svc"
      - "traefik.http.services.pgadmin-svc.loadbalancer.server.port=80"
    networks:
      - edge_network
      - internal_network

  # ==========================================
  # 12. PAROLA YÖNETİCİSİ: VAULTWARDEN
  # ==========================================
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DOMAIN=https://${VAULTWARDEN_INT_FQDN}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=true
      - INVITATION_ORG_NAME=${INVITATION_ORG_NAME}
      - EMERGENCY_ACCESS_ALLOWED=${EMERGENCY_ACCESS_ALLOWED}
      - WEBSOCKET_ENABLED=true
      - DATABASE_URL=postgresql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@db:5432/${VAULTWARDEN_DB_NAME}
      - TZ=${TZ}

    volumes:
      - vaultwarden_data:/data
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    labels:
      - "traefik.enable=true"
      # Router 1: Dahili (.intra -> 443)
      - "traefik.http.routers.vaultwarden-int.rule=Host(`${VAULTWARDEN_INT_FQDN}`)"
      - "traefik.http.routers.vaultwarden-int.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-int.tls=true"
      - "traefik.http.routers.vaultwarden-int.service=vaultwarden-svc"
      # Router 2: Harici (.com.tr -> 444 + CrowdSec Koruması)
      - "traefik.http.routers.vaultwarden-ext.rule=Host(`${VAULTWARDEN_EXT_FQDN}`)"
      - "traefik.http.routers.vaultwarden-ext.entrypoints=webexternal"
      - "traefik.http.routers.vaultwarden-ext.tls=true"
      - "traefik.http.routers.vaultwarden-ext.middlewares=crowdsec@file"
      - "traefik.http.routers.vaultwarden-ext.service=vaultwarden-svc"
      - "traefik.http.services.vaultwarden-svc.loadbalancer.server.port=80"
    networks:
      - edge_network
      - internal_network

