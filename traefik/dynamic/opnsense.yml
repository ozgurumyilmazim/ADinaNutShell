http:
  routers:
    opnsense-int:
      rule: "Host(`opnsense.sirket.intra`)"
      entryPoints:
        - "websecure"
      service: "opnsense-service"
      tls: {}

    opnsense-ext:
      rule: "Host(`opnsense.sirket.com.tr`)"
      entryPoints:
        - "webexternal"
      middlewares:
        - "crowdsec@file"
      service: "opnsense-service"
      tls: {}

  services:
    opnsense-service:
      loadBalancer:
        serversTransport: "ucsInternalTransport"
        servers:
          - url: "https://172.16.1.1:443"
        passHostHeader: true