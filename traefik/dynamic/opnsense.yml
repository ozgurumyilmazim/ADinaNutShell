http:
  routers:
    opnsense-router:
      rule: "Host(`opnsense.icat.intra`)"
      entryPoints:
        - "websecure"
      service: "opnsense-service"
      tls: {}

  services:
    opnsense-service:
      loadBalancer:
        serversTransport: "ucsInternalTransport"
        servers:
          - url: "https://172.16.1.1:443"
        passHostHeader: true